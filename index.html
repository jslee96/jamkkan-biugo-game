function wash(){stage.innerHTML=`<div style="text-align:center"><b>마음세탁소 · 세탁 코스</b><p class="hint">세탁기 문 안쪽을 원을 그리며 드래그하세요.</p></div><div class="washer"><div style="display:flex;justify-content:space-between;font-size:11px;font-weight:bold"><span>SMART WASH</span><span>● ● ●</span></div><div class="door" id="door"><div class="clothes" id="clothes">👕🧦</div></div><div style="text-align:center;font-size:10px">WASH · RINSE · SPIN</div></div><p class="hint" style="text-align:center">빙글빙글 돌려 세탁해 주세요 🫧</p>`;
let door=$('door'),clothes=$('clothes'),last=null,angle=0,total=0;door.onpointerdown=e=>{let r=door.getBoundingClientRect();last=Math.atan2(e.clientY-r.top-r.height/2,e.clientX-r.left-r.width/2);door.setPointerCapture(e.pointerId)};door.onpointermove=e=>{if(last===null||!active)return;let r=door.getBoundingClientRect(),a=Math.atan2(e.clientY-r.top-r.height/2,e.clientX-r.left-r.width/2),d=a-last;if(d>Math.PI)d-=2*Math.PI;if(d< -Math.PI)d+=2*Math.PI;angle+=d;total+=Math.abs(d);last=a;clothes.style.transform=`rotate(${angle*180/Math.PI}deg)`;progress(total/Math.PI*3.4,'세탁');if(p>=100){last=null;iron()}};door.onpointerup=door.onpointercancel=()=>last=null;
function iron(){active=false;stage.innerHTML=`<div style="text-align:center"><b>STEP 2 · 주름 펴기</b><p class="hint">옷 위를 손가락으로 문질러 주름을 펴주세요.</p></div><div class="shirtarea" id="shirt"><div class="shirt"></div><i class="wrinkle" style="width:65px;left:75px;top:65px"></i><i class="wrinkle" style="width:75px;left:110px;top:112px;transform:rotate(24deg)"></i><i class="wrinkle" style="width:48px;left:60px;top:155px"></i></div><p id="ironlabel" class="hint" style="text-align:center">주름을 슥슥 문질러 펴주세요.</p>`;let area=$('shirt'),n=0,drag=false;active=true;area.onpointerdown=e=>{drag=true;area.setPointerCapture(e.pointerId)};area.onpointermove=()=>{if(!drag||!active)return;n=Math.min(100,n+1.5);progress(n,'주름');if(n>=100){active=false;area.querySelectorAll('.wrinkle').forEach(w=>w.style.opacity=0);perfume()}};area.onpointerup=area.onpointercancel=()=>drag=false}
function perfume(){stage.insertAdjacentHTML('beforeend',`<div style="text-align:center"><b>STEP 3 · 섬유향수 뿌리기 🌸</b><p class="hint">옷의 서로 다른 부위를 5번 눌러 향기를 입혀주세요.</p><button class="btn" id="spray">🧴 섬유향수 선택</button></div>`);let n=0;$('spray').onclick=()=>{let area=$('shirt');$('spray').textContent='🌸 향수 분사 중';area.onclick=e=>{if(n>=5)return;n++;let s=document.createElement('span');s.textContent='✨';s.style.cssText=`position:absolute;left:${e.offsetX}px;top:${e.offsetY}px;font-size:24px`;area.append(s);progress(n*20,'향기');tone(700);if(n===5)done('🌸','향기롭게 세탁 완료!')};$('message').textContent='옷의 여러 곳을 톡톡 눌러주세요!'}}}
function pop(){stage.innerHTML=`<div style="text-align:center"><b>감정 팡팡 · 스트레스 날리기</b><p class="hint">원하는 풍선을 자유롭게 터뜨려 보세요!</p></div><div class="field" id="field"></div><p class="hint" style="text-align:center">풍선은 크기와 위치가 제각각이에요.</p>`;let f=$('field'),words=['상사 잔소리','밀린 업무','끝없는 회의','야근 확정','메신저 알림','갑작스런 수정','쌓인 메일','퇴근 직전 요청','월요일 출근','보고서 수정','일정 변경','눈치 보기'],colors=['#f6a6b5','#b9a8e8','#f6d18a','#9bcbd2','#e8a9d7','#b6d7a8'],total=16,n=0;for(let i=0;i<total;i++){let b=document.createElement('button'),s=48+Math.random()*48;b.className='balloon';b.textContent=words[i%words.length];b.style.width=s+'px';b.style.height=s+'px';b.style.left=Math.random()*(f.clientWidth-s)+'px';b.style.top=Math.random()*(f.clientHeight-s)+'px';b.style.background=colors[i%colors.length];b.onclick=()=>{if(!active)return;b.classList.add('pop');n++;progress(n/total*100,'터뜨림');tone(280+Math.random()*450);if(vibe&&navigator.vibrate)navigator.vibrate(18);setTimeout(()=>b.remove(),200);if(n===total)setTimeout(()=>done('🎊','스트레스 전부 팡팡!'),220)};f.append(b)}}
choose('shred');
})();
</script></body></html>

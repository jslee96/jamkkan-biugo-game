const SND={};let vt=0;const LP={};
function ac(){ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();return ctx}
(async()=>{try{let c=ac();for(const k in A){let b=Uint8Array.from(atob(A[k]),x=>x.charCodeAt(0)).buffer;SND[k]=await new Promise((r,j)=>c.decodeAudioData(b,r,j))}}catch(e){}})();
document.addEventListener('pointerdown',()=>{try{ac().resume()}catch(e){}},{passive:true});
function tone(f=400){if(!sound)return;try{let c=ac();if(c.state==='suspended')c.resume();let o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.value=.03;o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.07);o.stop(c.currentTime+.07)}catch(e){}}
function play(k,v=1,r=1){if(!sound||!SND[k])return;try{let c=ac();if(c.state==='suspended')c.resume();let s=c.createBufferSource(),g=c.createGain();s.buffer=SND[k];s.playbackRate.value=r;g.gain.value=v;s.connect(g);g.connect(c.destination);s.start()}catch(e){}}
function lp(k,v=1,h=140){if(!sound||!SND[k])return;try{let c=ac();if(c.state==='suspended')c.resume();let L=LP[k];if(!L){let s=c.createBufferSource(),g=c.createGain();s.buffer=SND[k];s.loop=true;g.gain.value=0;s.connect(g);g.connect(c.destination);s.start();L=LP[k]={s,g}}L.g.gain.setTargetAtTime(v,c.currentTime,.03);clearTimeout(L.t);L.t=setTimeout(()=>{try{L.g.gain.setTargetAtTime(0,c.currentTime,.05)}catch(e){}},h)}catch(e){}}
function lpOff(k){let L=LP[k];if(L&&ctx){clearTimeout(L.t);try{L.g.gain.setTargetAtTime(0,ctx.currentTime,.04)}catch(e){}}}
function lpStop(){for(const k in LP){try{clearTimeout(LP[k].t);LP[k].s.stop()}catch(e){}delete LP[k]}}
function win(){if(!sound)return;try{let c=ac(),t=c.currentTime;[523.25,659.25,783.99,1046.5].forEach((f,i)=>{let o=c.createOscillator(),g=c.createGain(),b=t+i*.11;o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.0001,b);g.gain.exponentialRampToValueAtTime(.12,b+.02);g.gain.exponentialRampToValueAtTime(.0001,b+.5);o.start(b);o.stop(b+.55)})}catch(e){}vib(60)}

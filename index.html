<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f8edf3"><title>잠깐, 비우고 가요</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{min-height:100%;overscroll-behavior-y:contain}body{margin:0;min-height:100dvh;overscroll-behavior-y:contain;background:linear-gradient(150deg,#fff7fb,#f0eafa);font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#493b4d}.wrap{max-width:520px;margin:auto;padding:17px}.hero{padding:22px;border-radius:24px;background:linear-gradient(135deg,#f7dce9,#e8e1f5)}h1{margin:6px 0;font-size:27px}.hero p,.hint{font-size:13px;color:#76677a}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.tab,button{font:inherit;cursor:pointer;touch-action:manipulation}.tab{border:1px solid #eadfea;background:white;border-radius:15px;padding:11px 4px;color:#493b4d}.tab.active{border:2px solid #ad87bc;background:#f8effa}.tab span{display:block;font-size:24px}.tab b{font-size:12px}.stage{background:#fff;border:1px solid #eee5ed;border-radius:22px;min-height:400px;padding:15px;position:relative;overflow:hidden}.top{display:flex;justify-content:space-between;font-size:12px;font-weight:bold;margin:12px 2px 7px}.track{height:8px;background:#eadfe9;border-radius:9px;overflow:hidden;margin-bottom:12px}.fill{height:100%;width:0;background:linear-gradient(90deg,#d89fbd,#9c7bb4)}.paper{width:min(100%,300px);height:250px;margin:12px auto;background:#fffdf7;border:1px solid #e7dfd1;position:relative;overflow:hidden;touch-action:none;box-shadow:0 8px 18px #53453316}.papertext{position:absolute;inset:14px 17px;line-height:2;font-size:13px;pointer-events:none;color:#65594e}.papertext h3{text-align:center;margin:0}.paper canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.bin{text-align:center;font-size:42px;margin:8px}.washer{width:245px;height:285px;margin:10px auto;background:linear-gradient(145deg,#fff,#d7dce3);border:3px solid #bbc2cc;border-radius:22px;padding:12px;box-shadow:inset 0 0 13px #9aa1aa}.door{width:190px;height:190px;margin:12px auto;border-radius:50%;border:12px solid #9da9b5;background:radial-gradient(circle at 38% 32%,#e9f5fa,#9ab5c5 62%,#536e82);overflow:hidden;touch-action:none}.clothes{height:100%;display:flex;align-items:center;justify-content:center;font-size:54px}.shirtarea{position:relative;width:250px;height:230px;margin:12px auto;touch-action:none}.shirt{position:absolute;inset:5px 12px;background:#dceaf0;clip-path:polygon(29% 0,43% 8%,57% 8%,71% 0,100% 20%,83% 49%,73% 39%,73% 100%,27% 100%,27% 39%,17% 49%,0 20%)}.wrinkle{position:absolute;height:3px;background:#84969e;border-radius:50%;pointer-events:none}.field{height:330px;position:relative;border-radius:17px;background:linear-gradient(150deg,#e9e4f8,#fbe8f0);overflow:hidden}.balloon{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;font-size:10px;font-weight:bold;color:#57445e;border:1px solid #ffffffb8;box-shadow:inset -9px -10px 17px #0001,inset 5px 5px 13px #fff9,0 6px 12px #0002}.balloon:after{content:"";position:absolute;top:17%;left:22%;width:22%;height:12%;border-radius:50%;background:#ffffffa8;transform:rotate(-35deg)}.balloon.pop{animation:pop .2s forwards;pointer-events:none}@keyframes pop{to{transform:scale(1.6);opacity:0}}.finish{position:absolute;inset:0;background:#fffdf4ed;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:4}.finish strong{font-size:48px}.btn{border:0;border-radius:13px;background:#80608e;color:white;font-weight:bold;padding:12px 18px}.controls{text-align:center;margin:12px 0}.controls button{background:#fff;border:1px solid #eadfea;border-radius:11px;padding:9px 11px;color:#725d78;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;background:#fff9;border:1px solid #eadfea;border-radius:15px;padding:12px;margin-top:14px}.stats b{display:block;font-size:21px}.stats small{color:#877a89}footer{text-align:center;color:#a091a3;font-size:11px;margin:15px}@media(max-width:600px){.wrap{padding:12px}.hero{padding:18px;border-radius:20px}h1{font-size:24px}.stage{padding:12px;min-height:390px}.paper{width:min(100%,300px);height:240px}.washer{max-width:100%}.shirtarea{max-width:100%}.field{height: min(330px, 48vh);min-height:260px}.stats{padding:10px 6px}.stats b{font-size:19px}.tab{padding:10px 2px}}
</style></head><body><div class="wrap">
<header class="hero"><small>A LITTLE BREAK FOR YOU</small><h1>잠깐, 비우고 가요 🌷</h1><p>오늘도 고생한 당신을 위한 작은 휴식.</p></header>
<nav class="tabs"><button class="tab active" data-g="shred"><span>📄</span><b>퇴근 파쇄소</b></button><button class="tab" data-g="wash"><span>🫧</span><b>마음세탁소</b></button><button class="tab" data-g="pop"><span>🎈</span><b>감정 팡팡</b></button></nav>
<div class="top"><span id="instruction">종이를 손가락으로 문질러 주세요!</span><span id="score">파쇄 0%</span></div><div class="track"><div class="fill" id="bar"></div></div><main class="stage" id="stage"></main>
<div class="controls"><button id="sound">🔊 효과음 ON</button> <button id="vibe">📳 진동 OFF</button> <button id="reset">↻ 다시 시작</button></div><div id="message" class="hint" style="text-align:center">천천히 해도 괜찮아요 💗</div>
<div class="stats"><div><b id="s1">0</b><small>파쇄 완료</small></div><div><b id="s2">0</b><small>세탁 완료</small></div><div><b id="s3">0</b><small>풍선 터뜨림</small></div></div><footer>잠깐 쉬어가도 괜찮아요. 오늘도 정말 수고했어요. 🌼</footer></div>
<script>
(()=>{const $=x=>document.getElementById(x),stage=$('stage');let game='shred',p=0,active=true,sound=true,vibe=false,counts=[0,0,0],ctx=null;
function tone(f=400){if(!sound)return;try{ctx=ctx||new(window.AudioContext||webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;o.connect(g);g.connect(ctx.destination);g.gain.value=.03;o.start();g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.07);o.stop(ctx.currentTime+.07)}catch(e){}}
function progress(n,label){p=Math.min(100,n);$('bar').style.width=p+'%';$('score').textContent=label+' '+Math.floor(p)+'%'}
function done(emoji,title){active=false;counts[game==='shred'?0:game==='wash'?1:2]++;counts.forEach((v,i)=>$('s'+(i+1)).textContent=v);let d=document.createElement('div');d.className='finish';d.innerHTML=`<strong>${emoji}</strong><h2>${title}</h2><p>잠깐의 휴식도 소중해요.</p><button class="btn" id="again">한 번 더 하기</button>`;stage.append(d);$('again').onclick=reset;tone(750)}
function reset(){active=true;p=0;progress(0,game==='shred'?'파쇄':game==='wash'?'세탁':'터뜨림');if(game==='shred')shred();if(game==='wash')wash();if(game==='pop')pop()}
function choose(g){game=g;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.g===g));$('instruction').textContent=g==='shred'?'종이를 손가락으로 문질러 주세요!':g==='wash'?'세탁기 안의 빨랫감을 원을 그리며 돌려주세요!':'풍선을 마음껏 터뜨려 주세요!';reset()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>choose(b.dataset.g));$('reset').onclick=reset;$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 효과음 ON':'🔇 효과음 OFF';tone()};$('vibe').onclick=()=>{vibe=!vibe;$('vibe').textContent=vibe?'📳 진동 ON':'📳 진동 OFF'};
function shred(){stage.innerHTML=`<div style="text-align:center"><b>오늘의 업무 · 문질러서 없애기</b><p class="hint">손가락으로 종이를 앞뒤로 문질러 보세요.</p></div><div class="paper" id="paper"><div class="papertext"><h3>업무 요청서</h3>□ 긴급 업무 요청<br>□ 끝없는 회의 자료 수정<br>□ 갑작스러운 일정 변경<br>□ 퇴근 직전 메신저 알림<br>□ 내일 아침까지 검토 요청<br><br>이 모든 업무는 오늘 여기 두고 가요.</div><canvas id="canvas"></canvas></div><div class="hint" style="text-align:center">종이가 잘게 사라질수록 파쇄율이 올라가요.</div><div class="bin" id="bin">🗑️</div><div class="hint" style="text-align:center">85% 이상 파쇄한 뒤 종이를 위로 밀어 넣으세요.</div>`;
let paper=$('paper'),c=$('canvas'),x=c.getContext('2d'),mask=document.createElement('canvas'),m=mask.getContext('2d'),drawing=false,last=null,strokes=0;
function size(){c.width=paper.clientWidth*devicePixelRatio;c.height=paper.clientHeight*devicePixelRatio;mask.width=c.width;mask.height=c.height;m.fillStyle='#fff';m.fillRect(0,0,mask.width,mask.height);x.clearRect(0,0,c.width,c.height);x.drawImage(mask,0,0)}size();
function point(e){let r=paper.getBoundingClientRect();return{x:(e.clientX-r.left)*devicePixelRatio,y:(e.clientY-r.top)*devicePixelRatio}}
paper.onpointerdown=e=>{if(!active)return;drawing=true;last=point(e);paper.setPointerCapture(e.pointerId)};
paper.onpointermove=e=>{if(!drawing||!active)return;let q=point(e);m.globalCompositeOperation='destination-out';m.lineWidth=48*devicePixelRatio;m.lineCap='round';m.beginPath();m.moveTo(last.x,last.y);m.lineTo(q.x,q.y);m.stroke();last=q;x.clearRect(0,0,c.width,c.height);x.drawImage(mask,0,0);if(++strokes%4===0){progress(p+1.2,'파쇄');if(strokes%12===0)tone(200)}};
paper.onpointerup=paper.onpointercancel=()=>drawing=false;let sy=0,bin=$('bin');bin.onpointerdown=e=>{sy=e.clientY;bin.setPointerCapture(e.pointerId)};bin.onpointerup=e=>{if(p>=85&&sy-e.clientY>25)done('🎉','업무 완전 파쇄!');else $('message').textContent='조금 더 문질러서 종이를 파쇄해 주세요!'};
}
function wash(){stage.innerHTML=`<div style="text-align:center"><b>마음세탁소 · 세탁 코스</b><p class="hint">세탁기 문 안쪽을 원을 그리며 드래그하세요.</p></div><div class="washer"><div style="display:flex;justify-content:space-between;font-size:11px;font-weight:bold"><span>SMART WASH</span><span>● ● ●</span></div><div class="door" id="door"><div class="clothes" id="clothes">👕🧦</div></div><div style="text-align:center;font-size:10px">WASH · RINSE · SPIN</div></div><p class="hint" style="text-align:center">빙글빙글 돌려 세탁해 주세요 🫧</p>`;
let door=$('door'),clothes=$('clothes'),last=null,angle=0,total=0;door.onpointerdown=e=>{let r=door.getBoundingClientRect();last=Math.atan2(e.clientY-r.top-r.height/2,e.clientX-r.left-r.width/2);door.setPointerCapture(e.pointerId)};door.onpointermove=e=>{if(last===null||!active)return;let r=door.getBoundingClientRect(),a=Math.atan2(e.clientY-r.top-r.height/2,e.clientX-r.left-r.width/2),d=a-last;if(d>Math.PI)d-=2*Math.PI;if(d< -Math.PI)d+=2*Math.PI;angle+=d;total+=Math.abs(d);last=a;clothes.style.transform=`rotate(${angle*180/Math.PI}deg)`;progress(total/Math.PI*3.4,'세탁');if(p>=100){last=null;iron()}};door.onpointerup=door.onpointercancel=()=>last=null;
function iron(){active=false;stage.innerHTML=`<div style="text-align:center"><b>STEP 2 · 주름 펴기</b><p class="hint">옷 위를 손가락으로 문질러 주름을 펴주세요.</p></div><div class="shirtarea" id="shirt"><div class="shirt"></div><i class="wrinkle" style="width:65px;left:75px;top:65px"></i><i class="wrinkle" style="width:75px;left:110px;top:112px;transform:rotate(24deg)"></i><i class="wrinkle" style="width:48px;left:60px;top:155px"></i></div><p id="ironlabel" class="hint" style="text-align:center">주름을 슥슥 문질러 펴주세요.</p>`;let area=$('shirt'),n=0,drag=false;active=true;area.onpointerdown=e=>{drag=true;area.setPointerCapture(e.pointerId)};area.onpointermove=()=>{if(!drag||!active)return;n=Math.min(100,n+1.5);progress(n,'주름');if(n>=100){active=false;area.querySelectorAll('.wrinkle').forEach(w=>w.style.opacity=0);perfume()}};area.onpointerup=area.onpointercancel=()=>drag=false}
function perfume(){stage.insertAdjacentHTML('beforeend',`<div style="text-align:center"><b>STEP 3 · 섬유향수 뿌리기 🌸</b><p class="hint">옷의 서로 다른 부위를 5번 눌러 향기를 입혀주세요.</p><button class="btn" id="spray">🧴 섬유향수 선택</button></div>`);let n=0;$('spray').onclick=()=>{let area=$('shirt');$('spray').textContent='🌸 향수 분사 중';area.onclick=e=>{if(n>=5)return;n++;let s=document.createElement('span');s.textContent='✨';s.style.cssText=`position:absolute;left:${e.offsetX}px;top:${e.offsetY}px;font-size:24px`;area.append(s);progress(n*20,'향기');tone(700);if(n===5)done('🌸','향기롭게 세탁 완료!')};$('message').textContent='옷의 여러 곳을 톡톡 눌러주세요!'}}}
function pop(){stage.innerHTML=`<div style="text-align:center"><b>감정 팡팡 · 스트레스 날리기</b><p class="hint">원하는 풍선을 자유롭게 터뜨려 보세요!</p></div><div class="field" id="field"></div><p class="hint" style="text-align:center">풍선은 크기와 위치가 제각각이에요.</p>`;let f=$('field'),words=['상사 잔소리','밀린 업무','끝없는 회의','야근 확정','메신저 알림','갑작스런 수정','쌓인 메일','퇴근 직전 요청','월요일 출근','보고서 수정','일정 변경','눈치 보기'],colors=['#f6a6b5','#b9a8e8','#f6d18a','#9bcbd2','#e8a9d7','#b6d7a8'],total=16,n=0;for(let i=0;i<total;i++){let b=document.createElement('button'),s=48+Math.random()*48;b.className='balloon';b.textContent=words[i%words.length];b.style.width=s+'px';b.style.height=s+'px';b.style.left=Math.random()*(f.clientWidth-s)+'px';b.style.top=Math.random()*(f.clientHeight-s)+'px';b.style.background=colors[i%colors.length];b.onclick=()=>{if(!active)return;b.classList.add('pop');n++;progress(n/total*100,'터뜨림');tone(280+Math.random()*450);if(vibe&&navigator.vibrate)navigator.vibrate(18);setTimeout(()=>b.remove(),200);if(n===total)setTimeout(()=>done('🎊','스트레스 전부 팡팡!'),220)};f.append(b)}}
choose('shred');
})();
</script></body></html>
